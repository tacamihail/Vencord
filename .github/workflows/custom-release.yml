name: Build custom Vencord release

on:
    push:
        tags:
            - "custom-*"

permissions:
    contents: read

jobs:
    build-vencord:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Vencord
              run: pnpm buildStandalone

            - name: Upload Vencord files
              uses: actions/upload-artifact@v4
              with:
                  name: vencord-dist
                  if-no-files-found: error
                  path: |
                      dist/patcher.js
                      dist/preload.js
                      dist/renderer.js
                      dist/renderer.css

    build-installer:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  path: vencord

            - uses: actions/checkout@v7
              with:
                  repository: Vencord/Installer
                  ref: 43d9d99b754fbabfcacb041b7bcd984d1c951905
                  path: installer

            - uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: true
                  install: >-
                      git
                      make
                      mingw-w64-x86_64-gcc
                      mingw-w64-x86_64-SDL2
                      mingw-w64-x86_64-go

            - name: Patch installer for this fork
              shell: pwsh
              run: |
                  ./vencord/scripts/patch-installer.ps1 -InstallerPath ./installer -Repository "$env:GITHUB_REPOSITORY"

            - name: Add installer build tag
              shell: msys2 {0}
              run: |
                  cd installer
                  git tag v0.0.0

            - name: Install Go build tools
              shell: msys2 {0}
              run: |
                  cd installer
                  export GOROOT=/mingw64/lib/go
                  export GOPATH=/mingw64
                  go mod download
                  go install github.com/tc-hib/go-winres@d743268d7ea168077ddd443c4240562d4f5e8c3e

            - name: Build GUI installer
              shell: msys2 {0}
              run: |
                  cd installer
                  export GOROOT=/mingw64/lib/go
                  export GOPATH=/mingw64
                  export PATH="/mingw64/bin:$PATH"
                  make GUI=1 VERSION="${GITHUB_REF_NAME}"

            - name: Upload installer
              uses: actions/upload-artifact@v4
              with:
                  name: custom-installer
                  if-no-files-found: error
                  path: installer/build/VencordInstaller.exe

    publish:
        runs-on: ubuntu-latest
        needs:
            - build-vencord
            - build-installer
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: vencord-dist
                  path: release

            - uses: actions/download-artifact@v4
              with:
                  name: custom-installer
                  path: release

            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
                  REPO: ${{ github.repository }}
              run: |
                  if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
                    gh release create "$TAG" --repo "$REPO" \
                      --title "Custom Vencord $TAG" \
                      --notes "Custom Vencord build including AutoStreamConnect. Source: https://github.com/$REPO/tree/$TAG"
                  fi
                  gh release upload "$TAG" --repo "$REPO" release/* --clobber
